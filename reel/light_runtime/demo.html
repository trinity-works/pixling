<!doctype html>
<meta charset="utf-8">
<title>__NAME__ Lit Sprite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; --bg: #0d0f14; --panel: #161a22; --ink: #e8e4d8; --dim: #9a9686; --accent: #ffb35c; --line: #2a2f3a; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 12px 16px 6px; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .keys { color: var(--dim); font-size: .85rem; }
  kbd { font: 600 .78rem ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); }
  main { position: relative; flex: 1; min-height: 260px; margin: 0 16px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 14px; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .hold { user-select: none; -webkit-user-select: none; min-width: 52px; }
  [hidden] { display: none !important; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>
<header>
  <h1>__NAME__</h1>
  <span class="keys"><kbd>A</kbd>/<kbd>D</kbd> <span id="move">walk</span>, <kbd>Shift</kbd> hurry, <kbd>1</kbd>–<kbd>9</kbd> clips, pointer moves the blue light (click pins it), <kbd>T</kbd> warm light, <kbd>L</kbd> lighting off/on</span>
</header>
<main><canvas id="c"></canvas><div id="msg">Loading…</div></main>
<div class="bar" id="bar">
  <button class="hold" id="bl" aria-label="Walk left">◀</button>
  <button class="hold" id="br" aria-label="Walk right">▶</button>
  <button id="bt" aria-pressed="true">Warm light</button>
  <button id="bL" aria-pressed="true">Lighting</button>
</div>
<script src="litsprite.js"></script>
<script>
(async () => {
  const cv = document.getElementById("c"), msg = document.getElementById("msg"), bar = document.getElementById("bar");
  const gl = cv.getContext("webgl", { premultipliedAlpha: false, alpha: false });
  if (!gl) { msg.textContent = "This page needs WebGL."; return; }
  let sheet;
  try { sheet = await LitSprite.load("__SHEET__"); } catch (e) { msg.textContent = e.message; return; }
  msg.hidden = true;
  const M = sheet.meta, R = new LitSprite.Renderer(gl);
  const keys = {}, st = { warm: true, pin: null, ptr: null };
  let W = 1, H = 1, ground = 1, actor;
  if (!M.anims[M.lead].speed) document.getElementById("move").textContent = "turn";    // nothing travels: keys only turn
  const extra = Object.keys(M.anims).filter(n => n !== M.lead && n !== M.rest);
  extra.slice(0, 9).forEach((n, i) => { const b = document.createElement("button"); b.textContent = `${i + 1} ${n}`; b.onclick = () => actor.play(n); bar.appendChild(b); });
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); W = r.width; H = r.height; ground = H * .84;
    const scale = H * .5 / M.height;
    if (!actor) actor = new LitSprite.Actor(sheet, { x: W * .35, scale });
    actor.scale = scale; actor.minX = W * .08; actor.maxX = W * .92;
  }
  addEventListener("resize", resize); resize();
  const map = { a: -1, arrowleft: -1, d: 1, arrowright: 1 };
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k in map) { keys[k] = true; e.preventDefault(); }
    if (k === "shift") keys.shift = true;
    if (k === "t") toggle("warm"); if (k === "l") toggle("lit");
    const i = parseInt(k, 10); if (i >= 1 && extra[i - 1]) actor.play(extra[i - 1]);
  });
  addEventListener("keyup", e => { const k = e.key.toLowerCase(); delete keys[k]; if (k === "shift") keys.shift = false; });
  addEventListener("blur", () => { for (const k in keys) delete keys[k]; });
  function toggle(w) {
    if (w === "warm") { st.warm = !st.warm; document.getElementById("bt").setAttribute("aria-pressed", st.warm); }
    else { R.enabled = !R.enabled; document.getElementById("bL").setAttribute("aria-pressed", R.enabled); }
  }
  document.getElementById("bt").onclick = () => toggle("warm"); document.getElementById("bL").onclick = () => toggle("lit");
  for (const [id, k] of [["bl", "arrowleft"], ["br", "arrowright"]]) {
    const b = document.getElementById(id);
    b.addEventListener("pointerdown", e => { e.preventDefault(); keys[k] = true; });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => delete keys[k]);
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: Math.min(e.clientY - r.top, ground - 20) }; };
  cv.addEventListener("pointermove", e => { st.ptr = pos(e); });
  cv.addEventListener("pointerleave", () => { st.ptr = null; });
  cv.addEventListener("pointerdown", e => { st.pin = pos(e); });
  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000, t = now / 1000; last = now;
    const move = Object.keys(map).reduce((s, k) => s + (keys[k] ? map[k] : 0), 0);
    actor.update(dt, { move: Math.sign(move), hurry: keys.shift });
    gl.viewport(0, 0, cv.width, cv.height); R.setView(0, 0, W, H);
    gl.clearColor(.05, .058, .08, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    R.fill(0, ground, W, H - ground, [.085, .09, .1, 1]);
    const lights = [];
    const flick = 1 + .045 * Math.sin(t * 6.3) + .03 * Math.sin(t * 11.7 + 1.3);
    const bh = M.height * actor.scale;                 // body height on screen: lights scale with the character
    const warm = { x: W * .7, y: ground - bh * 1.1, z: bh * .45, r: bh * 1.04, color: [1, .62, .32], power: 1.9 * flick };
    if (st.warm) lights.push(warm);
    const blue = st.ptr || st.pin;
    if (blue) lights.push({ x: blue.x, y: blue.y, z: bh * .24, r: bh * .61, color: [.35, .85, 1], power: 2.1 });
    R.blob(actor.x, ground, bh * .9, bh * .1, .55);
    R.actor(actor, ground, { ambient: [.09, .1, .15], sun: { dir: [-.45, -.8, .45], color: [.18, .24, .38] }, lights });
    if (st.warm) R.glow(warm.x, warm.y, bh * .19, [1, .55, .2].map(c => c * flick));
    if (blue) R.glow(blue.x, blue.y, bh * .15, [.3, .8, 1]);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
