name: release
# Push a tag vX.Y.Z (matching pyproject.toml and npm/package.json) to publish pixling to PyPI, then the npm launcher.
# Run it by hand (workflow_dispatch) to build and smoke-test the wheel without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./npm/package.json').version")
          echo "tag=$tag pyproject=$py npm=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - run: pip install build && python -m build
      - name: smoke test the wheel outside the repo
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/v/bin/pixling doctor || true
          /tmp/v/bin/pixling new fox smoke_fox
          /tmp/v/bin/pixling build specs/smoke_fox.json --clips idle --dirs S
          test -f out/smoke_fox/smoke_fox_idle.png
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi            # PyPI trusted publishing: no token stored here
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: main            # npm trusted publishing (OIDC): no token stored; provenance is automatic
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"     # npm 11.5.1+ for trusted publishing
          registry-url: "https://registry.npmjs.org"
      - run: npm publish ./npm --access public
