<title>Pixel Perfect explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Schibsted+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: full-height app. Top bar (wordmark + style tabs), a control strip (scene, hour, zoom), the map viewport fills the rest. */
:root {
  --bg: #121a17; --panel: #1b2622; --line: #2f4039; --fg: #e7e4d6; --muted: #9ea89b;
  --accent: #e0a64a; --sea: #5fb3a8; --stage: #0c1210;
  --f-mark: "Jersey 10", ui-monospace, monospace;
  --f-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef0e6; --panel: #e2e6d8; --line: #c5ccb8; --fg: #1b2420; --muted: #56615a; --accent: #a8641a; --sea: #2c7a70; --stage: #d5dacb; color-scheme: light } }
:root[data-theme="light"] { --bg: #eef0e6; --panel: #e2e6d8; --line: #c5ccb8; --fg: #1b2420; --muted: #56615a; --accent: #a8641a; --sea: #2c7a70; --stage: #d5dacb; color-scheme: light }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); display: flex; flex-direction: column; overflow: hidden }
* { box-sizing: border-box }
header { display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.mark { font: 1.8rem/1 var(--f-mark) }
.mark span { color: var(--accent) }
.tabs { display: flex; gap: 6px; flex-wrap: wrap }
button { font: 600 .85rem var(--f-body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #17120a }
button:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px }
.tabs button small { font-weight: 400; opacity: .75; margin-left: 6px }
.strip { display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--panel) }
.grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.grp label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 2px }
.about { color: var(--muted); font-size: .85rem; flex: 1 1 260px; min-width: 0 }
.stage { position: relative; flex: 1; overflow: hidden; background: var(--stage); touch-action: none; cursor: grab }
.stage.drag { cursor: grabbing }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform }
.world img.map { display: block; image-rendering: pixelated; image-rendering: crisp-edges; max-width: none }
.animal { position: absolute; image-rendering: pixelated; background-repeat: no-repeat; pointer-events: none }
.hud { position: absolute; left: 12px; bottom: 12px; display: grid; gap: 4px; background: rgba(10, 14, 12, .72); color: #e7e4d6; padding: 8px 10px; border-radius: 8px; font-size: .8rem; max-width: min(360px, calc(100% - 24px)) }
.hud kbd { font: .72rem var(--f-mono); border: 1px solid #556; border-radius: 3px; padding: 0 4px }
.pad { position: absolute; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 4px }
.pad button { background: rgba(10, 14, 12, .72); color: #e7e4d6; border-color: #445; padding: 0; font-size: 1rem }
.pad .c { grid-column: 2; grid-row: 2; font-size: .7rem }
@media (hover: hover) and (pointer: fine) { .pad { display: none } }
@media (max-width: 600px) { .about { display: none } .mark { font-size: 1.4rem } }
</style>

<header>
  <div class="mark">pixel perfect <span>explorer</span></div>
  <div class="tabs" id="styles" role="group" aria-label="Art style"></div>
</header>
<div class="strip">
  <div class="grp" id="scenes" role="group" aria-label="Scene"><label>Scene</label></div>
  <div class="grp" id="hours" role="group" aria-label="Hour"><label>Hour</label></div>
  <div class="grp" role="group" aria-label="Zoom"><label>Zoom</label><button type="button" id="zout" aria-label="Zoom out">−</button><span id="zv" style="font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center">4x</span><button type="button" id="zin" aria-label="Zoom in">+</button></div>
  <div class="grp"><button type="button" id="follow" aria-pressed="true">Follow animal</button></div>
  <div class="about" id="about"></div>
</div>
<div class="stage" id="stage">
  <div class="world" id="world"><img class="map" id="map" alt=""><div class="animal" id="animal" hidden></div></div>
  <div class="hud" id="hud"></div>
  <div class="pad" aria-label="Move the animal">
    <button type="button" data-k="up" style="grid-column:2;grid-row:1" aria-label="Up">▲</button>
    <button type="button" data-k="left" style="grid-column:1;grid-row:2" aria-label="Left">◀</button>
    <button type="button" data-k="right" style="grid-column:3;grid-row:2" aria-label="Right">▶</button>
    <button type="button" data-k="down" style="grid-column:2;grid-row:3" aria-label="Down">▼</button>
  </div>
</div>

<script>
const DATA = /*DATA*/null;
const $ = (s) => document.querySelector(s);
const st = { style: 0, scene: 0, hour: 0, zoom: 4, follow: true, cam: [0, 0], pos: [0, 0], dir: 0, frame: 0, ft: 0, moving: false };
const keys = new Set();
const SPEED = 22; // native px per second

function cur() { const s = DATA.styles[st.style]; return { s, sc: s.scenes[st.scene] }; }
function mk(tag, attrs, text) { const n = document.createElement(tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; return n; }

function buildTabs() {
  const host = $('#styles');
  DATA.styles.forEach((s, i) => {
    const b = mk('button', { type: 'button' });
    b.textContent = s.name; b.appendChild(mk('small', {}, s.tag));
    b.addEventListener('click', () => { st.style = i; st.scene = 0; st.hour = 0; loadScene(true); });
    host.appendChild(b);
  });
}

function fillGroup(id, items, active, onPick) {
  const g = $(id);
  [...g.querySelectorAll('button')].forEach((b) => b.remove());
  items.forEach((name, i) => {
    const b = mk('button', { type: 'button', 'aria-pressed': i === active ? 'true' : 'false' }, name);
    b.addEventListener('click', () => onPick(i));
    g.appendChild(b);
  });
  g.hidden = items.length <= 1 && id === '#hours';
}

function loadScene(resetPos) {
  const { s, sc } = cur();
  [...$('#styles').children].forEach((b, i) => b.setAttribute('aria-pressed', i === st.style ? 'true' : 'false'));
  fillGroup('#scenes', s.scenes.map((x) => x.name), st.scene, (i) => { st.scene = i; st.hour = 0; loadScene(true); });
  const hours = sc.hours.length ? sc.hours.map((h) => h.name) : ['Noon'];
  fillGroup('#hours', hours, st.hour, (i) => { st.hour = i; loadScene(false); });
  const img = (sc.hours[st.hour] && sc.hours[st.hour].img) || sc.img;
  const m = $('#map');
  m.src = img.src; m.width = img.w; m.height = img.h; m.alt = s.name + ' · ' + sc.name;
  $('#about').textContent = s.about + (sc.note ? ' ' + sc.note : '');
  if (resetPos) { st.pos = [sc.start[0], sc.start[1]]; st.dir = 0; st.frame = 0; fitZoom(); }
  const d = $('#animal');
  if (sc.animal) {
    d.hidden = false;
    d.style.backgroundImage = 'url(' + sc.animal.src + ')';
    d.style.width = sc.animal.fw + 'px'; d.style.height = sc.animal.fh + 'px';
    d.style.backgroundSize = (sc.animal.cols * sc.animal.fw) + 'px ' + (sc.animal.rows * sc.animal.fh) + 'px';
  } else d.hidden = true;
  $('#follow').hidden = !sc.animal;
  hud();
  place();
}

function fitZoom() {
  const { sc } = cur();
  const r = $('#stage').getBoundingClientRect();
  // largest integer zoom where the map covers at least ~60% of the shorter side, clamped 2..8
  let z = Math.floor(Math.min(r.width / sc.img.w, r.height / sc.img.h) * 1.6);
  st.zoom = Math.max(2, Math.min(8, z || 3));
  if (!sc.animal) st.cam = [sc.start[0], sc.start[1]];
}

function hud() {
  const { s, sc } = cur();
  const h = $('#hud'); h.textContent = '';
  h.appendChild(mk('b', {}, s.name + ' · ' + sc.name));
  const line = mk('span');
  if (sc.animal) line.innerHTML = 'Walk the animal: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows. Drag to look around. <kbd>+</kbd>/<kbd>−</kbd> zoom.';
  else line.innerHTML = 'Drag or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to look around. <kbd>+</kbd>/<kbd>−</kbd> zoom.';
  h.appendChild(line);
  h.appendChild(mk('span', { style: 'opacity:.7' }, sc.img.w + '×' + sc.img.h + ' px native, shown at ' + st.zoom + 'x'));
  $('#zv').textContent = st.zoom + 'x';
}

function place() {
  const { sc } = cur();
  const z = st.zoom, r = $('#stage').getBoundingClientRect();
  const focus = (sc.animal && st.follow) ? st.pos : st.cam;
  if (sc.animal && st.follow) st.cam = [st.pos[0], st.pos[1]];
  let tx = Math.round(r.width / 2 - focus[0] * z), ty = Math.round(r.height / 2 - focus[1] * z);
  const W = sc.img.w * z, H = sc.img.h * z;
  tx = W <= r.width ? Math.round((r.width - W) / 2) : Math.min(0, Math.max(r.width - W, tx));
  ty = H <= r.height ? Math.round((r.height - H) / 2) : Math.min(0, Math.max(r.height - H, ty));
  $('#world').style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
  if (sc.animal) {
    const d = sc.animal, el = $('#animal');
    const row = Math.min(d.rows - 1, st.dir), col = d.cols > 1 ? st.frame % d.cols : 0;
    el.style.left = Math.round(st.pos[0] - d.ax) + 'px'; el.style.top = Math.round(st.pos[1] - d.ay) + 'px';
    el.style.backgroundPosition = (-col * d.fw) + 'px ' + (-row * d.fh) + 'px';
    // single-direction sprites face right; flip when walking west
    const west = st.dir >= 5 && st.dir <= 7;
    el.style.transform = (d.rows === 1 && west) ? 'scaleX(-1)' : '';
  }
}

// direction index in S,SE,E,NE,N,NW,W,SW order from a screen vector
function dirOf(dx, dy) {
  const a = Math.atan2(dy, dx); // 0 = east, +y = down
  const oct = Math.round(a / (Math.PI / 4)); // -4..4
  const map = { 0: 2, 1: 1, 2: 0, 3: 7, 4: 6, '-4': 6, '-3': 5, '-2': 4, '-1': 3 };
  return map[oct];
}

let last = performance.now();
function tick(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const { sc } = cur();
  let dx = 0, dy = 0;
  if (keys.has('left')) dx -= 1; if (keys.has('right')) dx += 1;
  if (keys.has('up')) dy -= 1; if (keys.has('down')) dy += 1;
  if (dx || dy) {
    const n = Math.hypot(dx, dy); dx /= n; dy /= n;
    if (sc.animal) {
      st.follow = true; $('#follow').setAttribute('aria-pressed', 'true');
      st.pos[0] = Math.max(0, Math.min(sc.img.w, st.pos[0] + dx * SPEED * dt));
      st.pos[1] = Math.max(0, Math.min(sc.img.h, st.pos[1] + dy * SPEED * dt));
      st.dir = dirOf(dx, dy);
      st.ft += dt * 1000;
      if (st.ft >= sc.animal.ms) { st.ft = 0; st.frame++; }
    } else {
      st.cam[0] = Math.max(0, Math.min(sc.img.w, st.cam[0] + dx * SPEED * 3 * dt));
      st.cam[1] = Math.max(0, Math.min(sc.img.h, st.cam[1] + dy * SPEED * 3 * dt));
    }
    place();
  } else if (st.frame) { st.frame = 0; place(); }
  requestAnimationFrame(tick);
}

const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (KEYMAP[e.key]) { keys.add(KEYMAP[e.key]); e.preventDefault(); }
  else if (e.key === '+' || e.key === '=') zoom(1);
  else if (e.key === '-' || e.key === '_') zoom(-1);
});
addEventListener('keyup', (e) => { if (KEYMAP[e.key]) keys.delete(KEYMAP[e.key]); });
addEventListener('blur', () => keys.clear());

document.querySelectorAll('.pad button[data-k]').forEach((b) => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.add(k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, () => keys.delete(k)));
});

function zoom(d) { st.zoom = Math.max(1, Math.min(10, st.zoom + d)); hud(); place(); }
$('#zin').addEventListener('click', () => zoom(1));
$('#zout').addEventListener('click', () => zoom(-1));
$('#follow').addEventListener('click', () => { st.follow = !st.follow; $('#follow').setAttribute('aria-pressed', st.follow ? 'true' : 'false'); if (st.follow) place(); });

// drag to look around (detaches the camera from the animal)
const stage = $('#stage'); let drag = null;
stage.addEventListener('pointerdown', (e) => { if (e.target.closest('.pad')) return; drag = { x: e.clientX, y: e.clientY, cam: st.cam.slice() }; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  st.follow = false; $('#follow').setAttribute('aria-pressed', 'false');
  const { sc } = cur();
  st.cam = [Math.max(0, Math.min(sc.img.w, drag.cam[0] - (e.clientX - drag.x) / st.zoom)), Math.max(0, Math.min(sc.img.h, drag.cam[1] - (e.clientY - drag.y) / st.zoom))];
  place();
});
['pointerup', 'pointercancel'].forEach((ev) => stage.addEventListener(ev, () => { drag = null; stage.classList.remove('drag'); }));
stage.addEventListener('wheel', (e) => { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }, { passive: false });
addEventListener('resize', place);

buildTabs();
loadScene(true);
requestAnimationFrame(tick);
</script>
