<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Snow</title>
<style>
  /* one full-bleed pixel world; the only chrome is a name plate, a fading hint and the head-motion switch */
  @font-face { font-family: "Geist Pixel"; src: url("fonts/GeistPixel-Square.woff2") format("woff2"); font-display: swap; }
  :root {
    --night: #1c2440;   /* the darkest ink, behind the canvas while loading */
    --snow: #90afa3;    /* the lightest snow */
    --rose: #c4908c;    /* the cloud bank */
    --veil: rgba(28, 36, 64, .62);
    --pixel: "Geist Pixel", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--snow); overflow: hidden; font-family: var(--pixel); }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; outline: none; image-rendering: pixelated; }
  .plate { position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); pointer-events: none;
           font-size: clamp(18px, 2.6vw, 26px); letter-spacing: .06em; text-shadow: 0 2px 0 var(--night); }
  .plate small { display: block; font-size: 12px; letter-spacing: .14em; color: var(--rose); text-transform: uppercase; margin-top: 4px; }
  .hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
          background: var(--veil); padding: 8px 14px; font-size: 13px; letter-spacing: .03em; white-space: nowrap;
          max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity 1.4s ease; }
  .hint.gone { opacity: 0; }
  .buttons { position: fixed; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; }
  .motion { font: 12px var(--pixel); letter-spacing: .06em;
            color: var(--snow); background: var(--veil); border: 1px solid rgba(144, 175, 163, .35); padding: 8px 12px; cursor: pointer; }
  .motion:hover { border-color: var(--snow); }
  .motion:focus-visible { outline: 2px solid var(--snow); outline-offset: 2px; }
  /* the touch stick: a ring at bottom left; touching anywhere on the left side moves it under the thumb */
  .stick { position: fixed; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
           width: 128px; height: 128px; border-radius: 50%; border: 2px solid rgba(144, 175, 163, .55);
           background: rgba(28, 36, 64, .38); touch-action: none; user-select: none; -webkit-user-select: none; z-index: 2; }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
                 background: rgba(144, 175, 163, .7); border: 2px solid var(--snow); box-shadow: 0 2px 0 var(--night); pointer-events: none; }
  .stick.active { border-color: var(--snow); }
  .stick.active .knob { background: var(--snow); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; letter-spacing: .1em; }
  .loading[hidden] { display: none; }
  body.shot .plate, body.shot .hint, body.shot .buttons, body.shot .stick { display: none; }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
  @media (max-width: 520px) { .plate small { display: none; } .motion { padding: 6px 8px; font-size: 11px; } .stick { width: 112px; height: 112px; } }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="First person: walking up a snowy stair toward a parked car at dusk. WASD or arrows to walk, drag to look."></canvas>
<div class="plate">First Snow<small>hushfall · a walk at dusk</small></div>
<div class="hint" id="hint">Loading the snow…</div>
<div class="buttons"><button class="motion" id="auto" type="button" hidden>Walk on</button><button class="motion" id="sound" type="button" aria-pressed="false">Sound: off</button><button class="motion" id="motion" type="button">Head motion: full</button></div>
<div class="stick" id="stick" hidden aria-hidden="true"><div class="knob" id="knob"></div></div>
<div class="loading" id="loading">falling snow…</div>
<script>if (new URLSearchParams(location.search).has('shot')) document.body.classList.add('shot');</script>
<script type="module" src="fp.js"></script>
<script>
  // if the world can't load (no WebGL 2, a failed fetch), say so instead of snowing forever
  const failed = () => { const l = document.getElementById('loading'); if (l && !l.hidden) l.textContent = 'This walk needs WebGL 2 and a local server (pixling fp serve).'; };
  addEventListener('error', failed);
  addEventListener('unhandledrejection', failed);
  setTimeout(() => { const l = document.getElementById('loading'); if (l && !l.hidden && !window.__fp) l.textContent = 'Still loading… this walk needs WebGL 2.'; }, 15000);
</script>
</body>
</html>
